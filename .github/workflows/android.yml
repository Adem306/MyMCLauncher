name: Android CI

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  BuildDebug:
    runs-on: ubuntu-22.04

    env:
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build JRE JAR files
        run: |
          chmod +x gradlew
          mkdir out
          ./gradlew jre_lwjgl3glfw:build --no-daemon

      - name: Build Debug arm64
        run: |
          chmod +x gradlew
          ./gradlew ZalithLauncher:assembleDebug -Darch=arm64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyMC-debug-arm64
          path: ZalithLauncher/build/outputs/apk/debug/*
